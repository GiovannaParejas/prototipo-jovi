<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/notas.css" />
    <link rel="icon" href="../assets/favicon.ico" />
    <title>Notas — Jovi</title>
  </head>

  <body>
    <div class="celular">
      <header class="barra-superior">
        <span>9:30</span>
        <div>
          <span class="material-icons">signal_cellular_alt</span>
          <span class="material-icons">wifi</span>
          <span class="material-icons">battery_full</span>
        </div>
      </header>

      <div class="tela" id="tela-notas">
        <div class="app-header">
          <div class="app-header-top">
            <h1 class="app-titulo">Notas</h1>
            <button class="btn-nova-nota">
              <span class="material-icons">add</span>
            </button>
          </div>
          <div class="search-bar">
            <span class="material-icons">search</span>
            <input
              type="text"
              id="busca-notas"
              class="search-input"
              placeholder="Buscar notas..."
            />
          </div>
        </div>

        <div class="filtros" id="filtros-notas">
          <div class="filtro ativo" data-tipo="todas">Todas</div>
          <div class="filtro inativo" data-tipo="estudo">Estudo</div>
          <div class="filtro inativo" data-tipo="pessoal">Pessoal</div>
          <div class="filtro inativo" data-tipo="rascunho">Rascunho</div>
        </div>

        <div class="contador" id="contador-notas">4 notas</div>

        <main class="notas-lista" id="lista-notas"></main>
      </div>

      <div class="tela oculto" id="tela-pasta-notas">
        <div class="app-header">
          <button class="btn-voltar" onclick="fecharPastaNotas()">
            <span class="material-icons">arrow_back</span>
          </button>
          <h1 class="app-titulo" id="pasta-notas-titulo" style="font-size: 16px"></h1>
          <button class="btn-voltar" onclick="abrirSeletorNotasSoltasParaPasta()">
            <span class="material-icons">add</span>
          </button>
        </div>

        <main class="notas-lista" id="lista-pasta-notas"></main>
      </div>

      <footer class="barra-inferior">
        <button class="material-icons" onclick="voltarOuHistoricoNotas()">
          arrow_back
        </button>
        <button
          class="material-icons"
          onclick="window.location.href = './../../index.html'"
        >
          radio_button_unchecked
        </button>
        <button class="material-icons" onclick="alert('Abrir apps recentes')">
          menu
        </button>
      </footer>
    </div>

    <script src="../js/notas.js"></script>
  </body>
</html>
