<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/notas.css" />
    <link rel="icon" href="../assets/favicon.ico" />
    <title>Notas — Jovi</title>
  </head>

  <body>
    <div class="celular">
      <header class="barra-superior">
        <span>9:30</span>
        <div>
          <span class="material-icons">signal_cellular_alt</span>
          <span class="material-icons">wifi</span>
          <span class="material-icons">battery_full</span>
        </div>
      </header>

      <div class="app-header">
        <div class="app-header-top">
          <h1 class="app-titulo">Notas</h1>
          <button class="btn-nova-nota">
            <span class="material-icons">add</span>
          </button>
        </div>
        <div class="search-bar">
          <span class="material-icons">search</span>
          <span class="placeholder">Buscar notas...</span>
        </div>
      </div>

      <div class="filtros">
        <div class="filtro ativo">Todas</div>
        <div class="filtro inativo">Estudo</div>
        <div class="filtro inativo">Pessoal</div>
        <div class="filtro inativo">Rascunho</div>
      </div>

      <div class="contador" id="contador-notas">4 notas</div>

      <main class="notas-lista" id="lista-notas"></main>

      <footer class="barra-inferior">
        <button class="material-icons" onclick="history.back()">
          arrow_back
        </button>
        <button
          class="material-icons"
          onclick="window.location.href = './../../index.html'"
        >
          radio_button_unchecked
        </button>
        <button class="material-icons" onclick="alert('Abrir apps recentes')">
          menu
        </button>
      </footer>
    </div>

    <script src="../js/notas.js"></script>
  </body>
</html>
